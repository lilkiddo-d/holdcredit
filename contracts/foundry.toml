[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "../app/src/config/deployments" },
]
# Fork tests read RH_RPC_URL (defaults to the public endpoint).
[rpc_endpoints]
robinhood = "${RH_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[fuzz]
runs = 512
seed = "0x4844"

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
